name: Release

on:
  push:
    tags:
      - '[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild (e.g. 2026-10-13 or 2026-10-13.1)
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false
  queue: max

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Validate the release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
        run: |
          tag=$(scripts/release-version.sh "$RELEASE_TAG")
          printf 'tag=%s\ncommit=%s\n' \
            "$tag" "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_ARCH: ${{ matrix.arch }}
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false

      - uses: ./.github/actions/setup-build

      - name: Test the core library
        run: cargo test --release --locked --no-default-features

      - name: Build the executable
        if: runner.os != 'macOS'
        run: cargo build --release --locked

      - name: Build the app bundle
        if: runner.os == 'macOS'
        run: scripts/bundle.sh

      - name: Package the DMG, executable and app bundle
        if: runner.os == 'macOS'
        run: |
          actual_arch=$(lipo -archs target/release/rireki)
          if [[ "$actual_arch" != "$RELEASE_ARCH" ]]; then
            echo "::error::Expected $RELEASE_ARCH, got $actual_arch."
            exit 1
          fi
          codesign --force --sign - target/release/rireki.app
          codesign --verify --strict target/release/rireki.app
          mkdir -p dist
          archive="rireki-$RELEASE_TAG-$RELEASE_TARGET"
          tar -czf "dist/$archive.tar.gz" -C target/release rireki
          ditto -c -k --sequesterRsrc --keepParent \
            target/release/rireki.app "dist/$archive.zip"
          scripts/dmg.sh "dist/$archive.dmg"

      - name: Package the Linux executable
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf "dist/rireki-$RELEASE_TAG-$RELEASE_TARGET.tar.gz" -C target/release rireki

      - name: Package the Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/rireki.exe -DestinationPath "dist/rireki-$env:RELEASE_TAG-$env:RELEASE_TARGET.zip"

      - name: Upload release archives
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    needs: [metadata, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.dmg *.tar.gz *.zip > SHA256SUMS

      - name: Publish the release assets
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG" \
              --latest
          fi
