name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
          - runner: ubuntu-22.04
          - runner: windows-2022
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Test without GUI dependencies
        run: cargo test --locked --no-default-features --all-targets
      - name: Test the application
        run: cargo test --locked --all-targets
      - name: Check headless Rust lints
        run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - name: Check Rust lints
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build the release executable
        run: cargo build --release --locked
