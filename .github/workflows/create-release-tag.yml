name: Create release tag

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: create-release-tag
  cancel-in-progress: false
  queue: max

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Test release tag numbering
        run: python3 scripts/test-release-version.py

      - name: Create and push the release tag
        id: version
        run: |
          git fetch origin --tags
          tag=$(scripts/release-version.sh)
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'Created `%s` at `%s`. The Release job will publish its DMGs and archives.\n' \
            "$tag" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: tag
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
