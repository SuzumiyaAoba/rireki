[package]
name = "rireki"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
default-run = "rireki"

[[bin]]
name = "rireki"
path = "src/main.rs"

[[bin]]
name = "rireki-tui"
path = "src/tui_main.rs"
required-features = ["tui"]
test = false

[features]
default = ["gui", "tui"]
gui = ["dep:async-channel", "dep:gpui", "dep:two-face", "dep:unicode-segmentation", "dep:block", "dep:objc", "dep:windows-sys"]
tui = ["dep:crossterm", "dep:ratatui", "dep:unicode-segmentation"]

[dependencies]
async-channel = { version = "2.5.0", optional = true }
chrono = { version = "0.4.45", features = ["serde"] }
crossterm = { version = "0.29.0", optional = true }
dirs = "7.0.0"
gpui = { version = "0.2.2", optional = true }
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
lz4_flex = "0.14.0"
memchr = "2.8.3"
rayon = "1.12.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"], optional = true }
rquickjs = "0.14.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
simdutf8 = "0.1.5"
socket2 = "0.6.5"
tokio = { version = "1.53.2", features = ["rt", "net", "time", "sync", "macros"] }
twox-hash = { version = "2.1.4", default-features = false, features = ["std", "xxhash3_128"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"], optional = true }
unicode-segmentation = { version = "1.13.3", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# GPUI 0.2.2 の xattr 0.2.3 は Linux で libc 0.2.190 と非互換。
libc = "=0.2.189"

[target.'cfg(target_os = "macos")'.dependencies]
block = { version = "0.1.6", optional = true }
objc = { version = "0.2.7", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"], optional = true }

# 本体で実体化するジェネリック処理も最適化し、開発時の検査を維持する。
[profile.dev]
opt-level = 1
debug-assertions = true
overflow-checks = true

# 依存クレート（GPUI など）は dev ビルドでも最適化する。未最適化の GPUI は描画が極端に遅い
[profile.dev.package."*"]
opt-level = 3

# objc 0.2 のマクロが cfg(feature = "cargo-clippy") を使うため、既知の cfg として登録する
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
